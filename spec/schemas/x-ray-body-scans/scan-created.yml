name: xraybodyscans.scan.created
title: X-ray body scans service – a scan was recorded
contentType: application/json
payload:
  type: object
  properties:
    version:
      const: 1
    eventType:
      const: xraybodyscans.scan.created
    occurredAt:
      type: string
      format: date-time
      example: 2026-09-15T12:34:56+00:00
    description:
      type: string
      example: An x-ray body scan was recorded
    additionalInformation:
      type: object
      properties:
        id:
          description: X-ray body scan identifier
          type: string
          format: uuid
          example: 11111111-2222-3333-4444-555555555555
        prisonerNumber:
          description: Prisoner number of the scanned prisoner
          type: string
          example: A1111AA
        prisonId:
          description: Prison/establishment code where scan happened
          type: string
          example: MDI
